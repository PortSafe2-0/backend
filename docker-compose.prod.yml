services:

  postgres:
    image: postgres:15
    container_name: portsafe-postgres
    restart: always
    environment:
      POSTGRES_DB: portsafe_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-portsafe2025}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend/portsafe_api
      dockerfile: Dockerfile
    container_name: portsafe-api
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=portsafe_db;Username=postgres;Password=${DB_PASSWORD:-portsafe2025}
      - Jwt__Key=${JWT_KEY:-portsafe-jwt-secret-key-producao-2025}
      - Jwt__Issuer=PortSafeAPI
      - Jwt__Audience=PortSafeClients
      - Jwt__ExpiresInHours=24
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./interface_industrial/iface-portsafe
      dockerfile: Dockerfile
    container_name: portsafe-web
    restart: always

  nginx:
    image: nginx:alpine
    container_name: portsafe-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web

volumes:
  postgres_data:
