services:

  postgres:
    image: postgres:15
    container_name: portsafe-postgres
    restart: always
    environment:
      POSTGRES_DB: portsafe_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./
    container_name: portsafe-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=portsafe_db;Username=postgres;Password=postgres
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy